<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري معالجة الرابط...</title>
    <!-- مكتبات فايربيس الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 100px; font-family: sans-serif;">
        <h2>جاري تحويلك...</h2>
        <p>يرجى الانتظار لحظة واحدة</p>
    </div>

    <script>
        // 1. الكونفج الخاص بكِ (أنا وضعته لكِ هنا)
        const firebaseConfig = {
          apiKey: "AIzaSyBf5F5vhbpu8fjp4rS9M-Uj-gUPR88qbds",
          authDomain: "my-site-6f7ff.firebaseapp.com",
          databaseURL: "https://my-site-6f7ff-default-rtdb.firebaseio.com",
          projectId: "my-site-6f7ff",
          storageBucket: "my-site-6f7ff.firebasestorage.app",
          messagingSenderId: "171038692625",
          appId: "1:171038692625:web:4f5d02855d65aef7a768b0"
        };
        
        // تشغيل فايربيس
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. كود الـ Transaction (المحرك)
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');

        if (refId) {
            const userRef = db.ref('Users/' + refId);

            userRef.transaction((currentData) => {
                if (currentData) {
                    // زيادة العداد والأرباح
                    currentData.clicks = (currentData.clicks || 0) + 1;
                    currentData.daily_earnings = Number(((currentData.daily_earnings || 0) + 0.02).toFixed(2));
                    currentData.total_earnings = Number(((currentData.total_earnings || 0) + 0.02).toFixed(2));
                }
                return currentData;
            }).then(() => {
                console.log("تم احتساب الضغطة بنجاح!");
                // هنا تخلين الرابط اللي تريدين الزائر يروحله بعد ما تنحسب الفلوس
                // window.location.href = "https://t.me/your_channel"; 
            }).catch((err) => {
                console.error("خطأ:", err);
            });
        }
    </script>
</body>
</html>
