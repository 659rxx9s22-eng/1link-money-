<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة أرباح المروج </title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; direction: rtl; padding: 20px; }
        .box { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .btn { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-copy { background: #007bff; color: white; }
        .btn-withdraw { background: #28a745; color: white; }
        .btn-withdraw:disabled { background: #ccc; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="box">
    <h2>أهلاً بك في نظام الأرباح</h2>
    <div class="stat"><span>الضغطات:</span> <b id="c">0</b></div>
    <div class="stat"><span>أرباح اليوم:</span> <b id="d">$0.00</b></div>
    <div class="stat"><span>الإجمالي:</span> <b id="t">$0.00</b></div>

    <div style="margin-top:20px;">
        <label>رابط الترويج الخاص بك:</label>
        <input type="text" id="link" readonly>
        <button class="btn btn-copy" onclick="copy()">نسخ الرابط</button>
    </div>

    <div style="margin-top:20px; border-top: 2px solid #eee; pt: 10px;">
        <label>اسحب أرباحك (الحد الأدنى 15$):</label>
        <select id="m"><option>زين كاش</option><option>USDT</option></select>
        <input type="text" id="acc" placeholder="رقم المحفظة">
        <button id="wBtn" class="btn btn-withdraw" disabled onclick="withdraw()">طلب سحب</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBf5F5vhbpu8fjp4rS9M-Uj-gUPR88qbds",
        authDomain: "my-site-6f7ff.firebaseapp.com",
        databaseURL: "https://my-site-6f7ff-default-rtdb.firebaseio.com",
        projectId: "my-site-6f7ff",
        storageBucket: "my-site-6f7ff.firebasestorage.app",
        messagingSenderId: "171038692625",
        appId: "1:171038692625:web:4f5d02855d65aef7a768b0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            const path = 'Users/' + user.uid;
            // إنشاء رابط المروج
            document.getElementById('link').value = window.location.origin + "/index.html?ref=" + user.uid;
            
            // تحديث البيانات لحظياً
            db.ref(path).on('value', s => {
                const data = s.val() || { clicks:0, daily_earnings:0, total_earnings:0 };
                document.getElementById('c').innerText = data.clicks;
                document.getElementById('d').innerText = "$" + data.daily_earnings.toFixed(2);
                document.getElementById('t').innerText = "$" + data.total_earnings.toFixed(2);
                
                const btn = document.getElementById('wBtn');
                btn.disabled = data.total_earnings < 15;
            });
        }
    });

    function copy() { const i = document.getElementById('link'); i.select(); document.execCommand('copy'); alert("تم النسخ"); }

    function withdraw() {
        const user = firebase.auth().currentUser;
        const acc = document.getElementById('acc').value;
        if(!acc) return alert("اكتب رقم المحفظة");
        
        db.ref('Users/' + user.uid).once('value', s => {
            const amount = s.val().total_earnings;
            db.ref('Withdrawal_Requests').push({
                uid: user.uid, amount: amount, method: document.getElementById('m').value, details: acc, status: "pending"
            }).then(() => {
                db.ref('Users/' + user.uid).update({ daily_earnings: 0, total_earnings: 0 });
                alert("تم إرسال الطلب بنجاح");
            });
        });
    }
</script>
</body>
</html>
